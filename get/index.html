<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Saffron Street</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://tontechco.github.io/saffronstreet-site/assets/site.css">
<script>
// One link for house ads and posts: iOS → App Store, Android → Google Play, anything else → the home page.
(function(){
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var to = ios ? 'https://apps.apple.com/app/id6823965322'
         : /Android/.test(ua) ? 'https://play.google.com/store/apps/details?id=com.tontech.saffronstreet'
         : 'https://tontechco.github.io/saffronstreet-site/';
  location.replace(to);
})();
</script>
</head>

<p>Opening Saffron Street… <a href="https://apps.apple.com/app/id6823965322">App Store</a> · <a href="https://play.google.com/store/apps/details?id=com.tontech.saffronstreet">Google Play</a></p>
</div>

</html>
